services:
  postgres:
    image: postgres:17
    container_name: distrosync-erp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distrosync_erp

    ports:
      - "5433:5432"

    volumes:
      - erp_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distrosync_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: distrosync-erp-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    volumes:
      - erp_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  erp_postgres_data:
  erp_redis_data:
