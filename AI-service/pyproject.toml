[project]
name = "ai-service"
version = "0.1.0"
description = "DistroSync AI Service — RAG pipeline with hybrid retrieval"
authors = [
    { name = "tushar kaushik", email = "tusharkaushik520@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "groq>=0.13.0",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
